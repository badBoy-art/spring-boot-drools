<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>规则中台 · 配置台</title>
<style>
  :root{
    --bg:#f7f8fa; --panel:#fff; --line:#e6e8ec; --line2:#f0f1f4;
    --txt:#1f2328; --sub:#6b7280; --pri:#2563eb; --pri-soft:#eff4ff;
    --ok:#15803d; --ok-soft:#eefaf1; --warn:#b45309; --warn-soft:#fff7ed;
    --err:#b91c1c; --err-soft:#fef2f2; --radius:12px;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
       font:14px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  a{color:var(--pri);text-decoration:none}
  /* 顶栏 */
  .top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);
       display:flex;align-items:center;gap:22px;padding:0 26px;height:58px}
  .logo{font-weight:700;font-size:15.5px;letter-spacing:.2px}
  .logo small{font-weight:400;color:var(--sub);font-size:12px;margin-left:8px}
  .tabs{display:flex;gap:4px;flex:1}
  .tabs a{padding:7px 14px;border-radius:9px;color:var(--txt);font-weight:600;font-size:13.5px}
  .tabs a:hover{background:var(--line2)}
  .tabs a.on{background:var(--pri-soft);color:var(--pri)}
  .stat{font-size:12.5px;color:var(--sub)}
  .stat b{color:var(--txt)}
  /* 布局 */
  .wrap{max-width:1180px;margin:22px auto 60px;padding:0 22px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:20px 22px;margin-bottom:16px}
  .head{display:flex;align-items:flex-start;gap:14px;margin-bottom:14px}
  .head h2{margin:0;font-size:17px}
  .head .desc{color:var(--sub);font-size:12.5px;margin-top:4px}
  .head .acts{margin-left:auto;display:flex;gap:8px;flex-shrink:0}
  .crumb{font-size:12.5px;color:var(--sub);margin-bottom:12px}
  /* 按钮 */
  button,.btn{font:600 13px/1 inherit;padding:9px 15px;border-radius:9px;border:1px solid var(--line);
       background:#fff;color:var(--txt);cursor:pointer}
  button:hover{border-color:#cfd3da;background:#fcfcfd}
  .pri{background:var(--pri);border-color:var(--pri);color:#fff}
  .pri:hover{background:#1d4ed8;border-color:#1d4ed8}
  .ghost{border-color:transparent;background:transparent;color:var(--pri);padding:6px 8px}
  .danger{color:var(--err);border-color:#f3d6d6}
  button[disabled]{opacity:.5;cursor:not-allowed}
  /* 列表 */
  table{width:100%;border-collapse:collapse}
  th{font-size:12px;color:var(--sub);text-align:left;font-weight:600;padding:9px 12px;background:#fafbfc;border-bottom:1px solid var(--line)}
  td{padding:13px 12px;border-bottom:1px solid var(--line2);vertical-align:top}
  tbody tr.row{cursor:pointer}
  tbody tr.row:hover{background:#fcfdff}
  .title{font-weight:600}
  .sub{color:var(--sub);font-size:12.5px;margin-top:3px}
  code{background:var(--line2);padding:1.5px 6px;border-radius:5px;font-size:12.5px;font-family:ui-monospace,Menlo,monospace}
  /* 徽标 */
  .tag{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:99px;border:1px solid var(--line);
       background:#fafbfc;color:var(--sub);margin:2px 4px 0 0}
  .tag.b{background:var(--pri-soft);border-color:#d6e2ff;color:var(--pri)}
  .tag.g{background:var(--ok-soft);border-color:#cbe9d6;color:var(--ok)}
  .tag.w{background:var(--warn-soft);border-color:#f6dfc7;color:var(--warn)}
  .tag.r{background:var(--err-soft);border-color:#f6d5d5;color:var(--err)}
  /* 详情 */
  .kv{display:grid;grid-template-columns:132px 1fr;gap:10px 16px;font-size:13px}
  .kv .k{color:var(--sub)}
  pre{margin:8px 0 0;background:#0f172a;color:#e2e8f0;padding:14px 16px;border-radius:10px;
      overflow:auto;font-size:12.5px;line-height:1.7;max-height:340px}
  input,select,textarea{font:13.5px inherit;padding:9px 11px;border:1px solid var(--line);border-radius:9px;width:100%;background:#fff;color:var(--txt)}
  textarea{min-height:74px;font-family:ui-monospace,Menlo,monospace;font-size:12.5px}
  label{display:block;font-size:12px;color:var(--sub);margin:0 0 5px}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  .msg{margin-top:12px;font-size:13px;padding:10px 13px;border-radius:9px;display:none}
  .msg.show{display:block}
  .msg.ok{background:var(--ok-soft);color:var(--ok)}
  .msg.err{background:var(--err-soft);color:var(--err)}
  .empty{padding:34px;text-align:center;color:var(--sub);font-size:13px}
  .steps th,.steps td{padding:10px}
  .stepbar{display:flex;align-items:center;gap:10px;margin:0 0 10px}
  .stepno{width:24px;height:24px;border-radius:50%;background:var(--pri);color:#fff;font-size:12px;
          font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .stepcard{border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:10px;background:#fcfdff}
  .flow{font-size:12.5px;color:var(--sub);margin-top:6px}
</style>
</head>
<body>
<div class="top">
  <div class="logo">规则中台 <small>配置台 · 研发维护</small></div>
  <nav class="tabs">
    <a href="#/docs" id="tab-docs">单据注册</a>
    <a href="#/actions" id="tab-actions">接口注册</a>
    <a href="#/types" id="tab-types">规则类型</a>
  </nav>
  <div class="stat">生效规则 <b id="st-rules">-</b> ｜ 已发布 <b id="st-pub">-</b></div>
</div>
<div class="wrap" id="view"></div>
<script>
/* ============ 基础 ============ */
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const J = {method:'POST', headers:{'Content-Type':'application/json'}};
async function api(path, opt) {
  const res = await fetch(path, opt);
  const text = await res.text();
  let body; try { body = text ? JSON.parse(text) : {}; } catch (e) { body = {message:text}; }
  if (!res.ok) throw new Error(body.message || body.error || res.status);
  return body;
}
const post = (p, b) => api(p, Object.assign({}, J, {body: JSON.stringify(b == null ? {} : b)}));
const del  = p => api(p, {method:'DELETE'});
const msg = (el, text, kind) => { const n = $(el); if (!n) return; n.className = 'msg show ' + (kind||'ok'); n.textContent = text; };
let DOCS = [], ACTIONS = [], TYPES = [], RULES = [], REFS = {docs:{}, actions:{}}, CATEGORIES = [], DOMAINS = {currentEnv:'dev', domains:[]};

async function loadCommon() {
  const [d, a, t, r, info, refs, cats, dom] = await Promise.all([
    api('rule/doc/tree'), api('rule/http/actions'), api('rule/type/list'),
    api('rule/list'), api('rule/engine/info'), api('rule/refs'),
    api('rule/http/categories'), api('rule/http/domains')
  ]);
  DOCS = d; ACTIONS = a; TYPES = t; RULES = r; REFS = refs; CATEGORIES = cats; DOMAINS = dom;
  $('st-rules').textContent = info.ruleCount;
  $('st-pub').textContent = info.publishedRuleCount;
}
/* ============ ① 单据注册：列表 + 详情 ============ */
function docsList() {
  const rows = DOCS.map(d => {
    const ref = REFS.docs[d.docCode] || {refCount:0};
    const objs = (d.tree || []).length;
    return `<tr class="row" onclick="location.hash='#/docs/${esc(d.docCode)}'">
      <td><div class="title">${esc(d.docName)}</div><div class="sub"><code>${esc(d.docCode)}</code>${d.remark ? ' ｜ ' + esc(d.remark) : ''}</div></td>
      <td>${objs} 个对象<div class="sub">${d.fieldCount} 个字段</div></td>
      <td>${refBadge('doc', d.docCode)}</td>
      <td style="text-align:right"><button onclick="event.stopPropagation();location.hash='#/docs/${esc(d.docCode)}'">查看</button></td>
    </tr>`;
  }).join('');
  return card('单据', '一个单据注册一次，可被多个规则类型 / 多条规则 / 多个接口引用（一处注册，多处调用）',
    `<button class="pri" onclick="toggleNew('new-doc')">+ 新建单据</button>`,
    `<div id="new-doc" style="display:none" class="stepcard">
       <div class="grid">
         <div><label>单据编码 docCode（大写字母/数字/下划线）</label><input id="d-code" placeholder="SKU"/></div>
         <div><label>单据名称</label><input id="d-name" placeholder="商品"/></div>
         <div><label>说明</label><input id="d-remark" placeholder="商品主数据"/></div>
       </div>
       <div style="margin-top:12px"><button class="pri" onclick="saveDoc()">新建单据</button>
         <button onclick="toggleNew('new-doc')">取消</button></div>
       <div class="msg" id="msg-doc"></div>
     </div>` +
    (rows ? `<table><thead><tr><th style="width:36%">单据</th><th style="width:20%">结构</th><th>被引用（一处注册，多处调用）</th><th></th></tr></thead><tbody>${rows}</tbody></table>`
          : '<div class="empty">还没有单据，点右上「+ 新建单据」</div>'));
}

function docDetail(code) {
  const d = DOCS.find(x => x.docCode === code);
  if (!d) return card('单据不存在', '', '', '<div class="empty">找不到 ' + esc(code) + '</div>');
  const ref = REFS.docs[code] || {refCount:0};
  const objs = (d.tree || []).map(o => objBlock(code, o)).join('');
  const delBtn = ref.refCount > 0
    ? `<button disabled title="被引用中，先处理引用再删">删除单据</button>`
    : `<button class="danger" onclick="removeDoc('${esc(code)}')">删除单据</button>`;
  return `<div class="crumb"><a href="#/docs">单据</a> / ${esc(d.docName)}</div>` +
    card(`${esc(d.docName)} <code>${esc(d.docCode)}</code>`, '单据详情：对象结构 + 字段；字段的「计算表达式」就是派生指标（如毛利率）',
      `${delBtn}<button onclick="toggleNew('new-obj')">+ 新建对象</button>`,
      `<div class="kv">
         <div class="k">单据编码</div><div><code>${esc(d.docCode)}</code></div>
         <div class="k">说明</div><div>${esc(d.remark || '-')}</div>
         <div class="k">字段总数</div><div>${d.fieldCount} 个</div>
         <div class="k">被引用</div><div>${refBadge('doc', code)}</div>
       </div>
       <div id="new-obj" style="display:none" class="stepcard" style="margin-top:14px">
         <div class="grid">
           <div><label>对象标识 objectKey</label><input id="o-key" placeholder="customer"/></div>
           <div><label>对象中文名</label><input id="o-name" placeholder="客户"/></div>
           <div><label>父对象（空=根对象）</label><select id="o-parent"></select></div>
           <div><label>是否数组对象</label><select id="o-coll"><option value="0">否</option><option value="1">是（按 items[0] 取）</option></select></div>
           <div><label>取值路径</label><input id="o-path" placeholder="items[0]"/></div>
         </div>
         <div style="margin-top:12px"><button class="pri" onclick="saveObj('${esc(code)}')">新建对象</button>
           <button onclick="toggleNew('new-obj')">取消</button></div>
         <div class="msg" id="msg-obj"></div>
       </div>` + objs);
}

function objBlock(code, o) {
  const fields = (o.fields || []).map(f => `<tr>
      <td>${esc(f.fieldName)}<div class="sub"><code>${esc(f.fieldKey)}</code></div></td>
      <td>${esc(f.fieldType)}</td>
      <td>${f.expr ? '<span class="tag b">计算 ' + esc(f.expr) + '</span>' : (esc(f.exampleValue || '-'))}</td>
      <td>${esc(f.fieldDesc || '-')}</td>
      <td style="text-align:right">
        <button class="ghost" onclick="copyTxt('\${${esc(f.fieldKey)}}')">复制取值</button>
        <button class="ghost" onclick="loadFieldForm('${esc(code)}','${esc(o.objectKey)}','${esc(f.fieldKey)}')">编辑</button>
      </td></tr>`).join('');
  return `<div class="stepcard">
    <div class="stepbar">
      <span class="stepno" style="background:#0f172a">${o.isCollection === 1 ? '[]' : '{}'}</span>
      <b>${esc(o.objectName)}</b>
      <code>${esc(o.objectKey)}</code>
      <span class="sub">${o.valuePath ? '路径 ' + esc(o.valuePath) : ''}${o.remark ? ' ｜ ' + esc(o.remark) : ''}</span>
      <span style="margin-left:auto"><button onclick="toggleNew('new-field-${esc(o.objectKey)}')">+ 新建字段</button></span>
    </div>
    ${fields ? `<table><thead><tr><th style="width:22%">字段</th><th style="width:12%">类型</th><th style="width:20%">示例 / 计算</th><th>说明</th><th></th></tr></thead><tbody>${fields}</tbody></table>`
             : '<div class="sub">（该对象下还没有字段）</div>'}
    <div id="new-field-${esc(o.objectKey)}" style="display:none;margin-top:12px">
      <div class="grid">
        <div><label>字段中文名</label><input id="f-${esc(o.objectKey)}-name" placeholder="毛利率"/></div>
        <div><label>fieldName 取值路径</label><input id="f-${esc(o.objectKey)}-key" placeholder="(price - cost) * 1.0 / price"/></div>
        <div><label>类型</label><select id="f-${esc(o.objectKey)}-type"><option>STRING</option><option>NUMBER</option><option>DECIMAL</option><option>BOOL</option></select></div>
        <div><label>示例值</label><input id="f-${esc(o.objectKey)}-ex" placeholder="0.35"/></div>
        <div><label>说明</label><input id="f-${esc(o.objectKey)}-desc" placeholder="派生字段：(售价-成本)/售价"/></div>
        <div><label>计算表达式（可空；填了就是派生字段，引擎进规则前先算好）</label><input id="f-${esc(o.objectKey)}-expr" placeholder="(price - cost) * 1.0 / price"/></div>
      </div>
      <div style="margin-top:12px"><button class="pri" onclick="saveField('${esc(code)}','${esc(o.objectKey)}')">新建字段</button>
        <button onclick="toggleNew('new-field-${esc(o.objectKey)}')">取消</button></div>
      <div class="msg" id="msg-f-${esc(o.objectKey)}"></div>
    </div>
    ${(o.children || []).map(c => objBlock(code, c)).join('')}
  </div>`;
}

function refBadge(kind, key) {
  const item = kind === 'doc' ? REFS.docs[key] : REFS.actions[key];
  if (!item || !item.refCount) return '<span class="tag">未被引用（可安全删除）</span>';
  const map = kind === 'doc'
    ? [['types','类型'],['rules','规则'],['tables','组合表'],['actions','接口']]
    : [['docs','单据'],['types','类型'],['rules','规则'],['tables','组合表']];
  return map.filter(([f]) => (item[f]||[]).length)
    .map(([f,label]) => (item[f]||[]).map(x => `<span class="tag b">${label} ${esc(x)}</span>`).join('')).join('');
}
function card(title, desc, acts, body) {
  return `<div class="card"><div class="head"><div><h2>${title}</h2>${desc ? '<div class="desc">' + desc + '</div>' : ''}</div>
    <div class="acts">${acts || ''}</div></div>${body || ''}</div>`;
}
function toggleNew(id) { const n = $(id); if (n) n.style.display = n.style.display === 'none' ? 'block' : 'none'; }
function copyTxt(t) { try { navigator.clipboard.writeText(t); } catch (e) {} }

/* ============ ② 接口注册：列表 + 详情 ============ */
function actionsList() {
  const rows = ACTIONS.map(a => {
    const item = REFS.actions[a.actionCode] || {};
    const scope = item.universal ? '通用（所有单据）' : ((item.scope||[]).join(', ') || '通用');
    return `<tr class="row" onclick="location.hash='#/actions/${esc(a.actionCode)}'">
      <td><div class="title">${esc(a.actionName)}</div><div class="sub"><code>${esc(a.actionCode)}</code> ｜ ${esc(a.actionCategory||'未分类')}</div></td>
      <td><code>${esc(a.method)}</code> <span class="sub">${esc(a.domainKey)}${esc(a.path)}</span>
          <div class="sub">超时 ${a.timeoutMs}ms${a.authCode ? ' ｜ 认证 ' + esc(a.authCode) : ''}${a.reqEncrypt && a.reqEncrypt!=='NONE' ? ' ｜ 加密 ' + esc(a.reqEncrypt) : ''}</div></td>
      <td><span class="tag w">${esc(scope)}</span></td>
      <td>${refBadge('action', a.actionCode)}</td>
      <td style="text-align:right"><button onclick="event.stopPropagation();location.hash='#/actions/${esc(a.actionCode)}'">查看</button></td>
    </tr>`;
  }).join('');
  return card('接口', '接口是独立资产：注册一次，任何单据的规则都能调它（适用单据留空 = 通用）；入参模板支持 ${字段} 与 ${ext.上一步回填值}',
    `<button class="pri" onclick="toggleNew('new-action')">+ 新建接口</button>`,
    `<div id="new-action" style="display:none" class="stepcard">${actionForm(null)}</div>` +
    (rows ? `<table><thead><tr><th style="width:28%">接口</th><th style="width:32%">请求</th><th style="width:14%">适用范围</th><th>被引用</th><th></th></tr></thead><tbody>${rows}</tbody></table>`
          : '<div class="empty">还没有接口，点右上「+ 新建接口」</div>'));
}

function actionForm(a) {
  const v = a || {};
  const co = k => v[k] == null ? '' : v[k];
  const opt = (list, cur, labels) => list.map((x,i) => `<option value="${x}"${x === cur ? ' selected' : ''}>${labels ? labels[i] : x}</option>`).join('');
  return `
  <div class="grid">
    <div><label>动作码 actionCode（主键，大写）</label><input id="a-code" value="${esc(co('actionCode'))}" placeholder="ORDER_PUSH"/></div>
    <div><label>接口名称</label><input id="a-name" value="${esc(co('actionName'))}" placeholder="订单推送"/></div>
    <div><label>分类（可自助添加）</label>
      <div style="display:flex;gap:8px"><select id="a-cat"></select><button onclick="addCategory()">+ 新增分类</button></div></div>
    <div><label>方法</label><select id="a-method">${opt(['POST','GET','PUT','DELETE'], co('method')||'POST')}</select></div>
    <div><label>参数位置（GET/DELETE 默认走 URL query，POST/PUT 默认走请求体）</label>
      <select id="a-paramin">${opt(['AUTO','QUERY','BODY'], co('paramIn')||'AUTO', ['自动（按方法判断）','URL query 参数','请求体参数'])}</select></div>
    <div><label>域名（填域名键 → 按环境解析；也可直接填 https:// 开头的完整域名）</label>
      <div style="display:flex;gap:8px"><input id="a-domain" value="${esc(co('domainKey'))}" placeholder="mock"/>
        <button onclick="toggleNew('env-domain')">环境域名</button></div></div>
    <div><label>路径 path</label><input id="a-path" value="${esc(co('path'))}" placeholder="/risk"/></div>
    <div><label>超时(ms)</label><input id="a-timeout" value="${esc(co('timeoutMs')||2000)}"/></div>
    <div><label>额外请求头 JSON（值支持 单据字段 / ext.上游回填 / 表达式，调用时渲染）</label><input id="a-headers" value="${esc(co('headersJson'))}" placeholder='{"X-Tenant":"demo","X-Biz":"${'${orderId}'}"}'/></div>
    <div><label>适用单据（多选；不选=通用）</label><select id="a-scopes" multiple size="3" style="min-height:70px">${(v._scopes||[]).length ? '' : ''}${DOCS.map(d => `<option value="${esc(d.docCode)}"${(v._scopes||[]).indexOf(d.docCode) >= 0 ? ' selected' : ''}>${esc(d.docName)}（${esc(d.docCode)}）</option>`).join('')}</select></div>
  </div>
  <div style="margin-top:14px"><label>入参模板 bodyTemplate —— 这里写「逻辑参数名」，具体取哪个值由规则侧绑定</label>
    <div class="sub">例：{"bizId":"${'${bizId}'}","amount":${'${amount}'},"channel":"${'${channel}'}"} —— 数字字段写成裸的（不加引号），字符串加引号；
      规则里再写 bizId = ${'${orderId}'} / amount = ${'${totalAmount}'} / channel = 规则引擎。也可以直接写上下文路径（${'${orderId}'}）作为接口自身的默认取值。</div>
    <textarea id="a-body" placeholder='示例：{"bizId":"${'${bizId}'}","amount":${'${amount}'}}' oninput="hintBody()">${esc(co('bodyTemplate'))}</textarea>
    <div id="a-body-hint">${templateHint(co('bodyTemplate'))}</div></div>
  <div class="grid" style="margin-top:14px">
    <div><label>认证配置</label><select id="a-auth"></select></div>
    <div><label>请求体加密</label><select id="a-reqenc">${opt(['NONE','AES_CBC','AES_GCM'], co('reqEncrypt')||'NONE')}</select></div>
    <div><label>加密密钥引用名</label><input id="a-reqkey" value="${esc(co('reqEncryptKeyRef'))}" placeholder="aesKey"/></div>
    <div><label>响应体解密</label><select id="a-respdec">${opt(['NONE','AES_CBC','AES_GCM'], co('respDecrypt')||'NONE')}</select></div>
    <div><label>解密密钥引用名</label><input id="a-respkey" value="${esc(co('respDecryptKeyRef'))}" placeholder="aesKey"/></div>
    <div><label>签名算法 / 位置</label>
      <div style="display:flex;gap:8px"><select id="a-sign">${opt(['NONE','HMAC_SHA256','MD5','MD5_SALT'], co('signType')||'NONE')}</select>
      <select id="a-signplace">${opt(['HEADER','BODY'], co('signPlace')||'HEADER')}</select></div></div>
    <div><label>签名密钥引用名</label><input id="a-signkey" value="${esc(co('signKeyRef'))}" placeholder="hmacKey"/></div>

const PARAM_CACHE = {};
/** 该步骤的绑定里，哪些参数名在接口模板中不存在 → 会静默失效，必须提示出来 */
function uselessBindings(i) {
  const s = ED.steps[i] || {};
  const p = PARAM_CACHE[s.actionCode];
  const tpl = (p && p.bodyTemplate) || '';
  const bad = [];
  String(s.paramText || '').split('\n').map(l => l.trim()).filter(Boolean).forEach(line => {
    const key = line.split('=')[0].trim();
    if (!key || key === '_headers') return;
    if (!tpl.includes('${' + key + '}')) bad.push(key);
  });
  return bad;
}
async function loadActionParams(i, code) {
  const el = document.getElementById('ap-' + i); if (!el || !code) return;
  let p = PARAM_CACHE[code];
  if (!p) {
    try { p = await api('rule/http/action/' + code + '/params'); PARAM_CACHE[code] = p; }
    catch (e) { el.textContent = '读取接口参数失败：' + e.message; return; }
  }
  const names = (p.placeholders || []).map(x => x.name);
  const bad = uselessBindings(i);
  let html = names.length
    ? `该接口声明的参数（按名字绑值才生效）：${names.map(n => `<code>${esc(n)}</code>`).join('、')}`
    : '该接口模板里没有「逻辑参数名」（它把取值直接写成了上下文路径），所以在这里绑任何参数名都不会生效';
  if (bad.length) {
    html += `<div class="tag r" style="margin-top:6px">⚠ 这几条绑定不会生效：${bad.map(b => esc(b)).join('、')} ——
      接口模板里找不到 <code>${'${' + esc(bad[0]) + '}'}</code>${names.length ? '' : '（模板用的是上下文路径）'}。
      要么把接口模板的取值改成 <code>"${'${' + esc(bad[0]) + '}"'}</code> 再由这里绑值，要么删掉这几行。</div>`;
  }
  el.innerHTML = html;
}
function extFieldOptions(docCode, cur) {
  const d = DOCS.find(x => x.docCode === docCode);
  const groups = [];
  const walk = (nodes, path) => (nodes || []).forEach(o => {
    const label = (path ? path + ' → ' : '') + o.objectName + ' ' + o.objectKey;
    const opts = (o.fields || []).map(f => `<option value="${esc(f.fieldKey)}"${f.fieldKey === cur ? ' selected' : ''}>${esc(f.fieldName)}（${esc(f.fieldKey)}）</option>`).join('');
    if (opts) groups.push(`<optgroup label="${esc(label)}">${opts}</optgroup>`);
    walk(o.children, label);
  });
  walk(d && d.tree, '');
  return (cur && !groups.includes('value="' + cur + '"') ? `<option value="${esc(cur)}" selected>${esc(cur)}（当前）</option>` : '') + groups.join('');
}
function linesToJson(text) {
  if (!text || !text.trim()) return '';
  const o = {};
  text.split('\n').forEach(line => {
    const idx = line.indexOf('=');
    if (idx <= 0) return;
    const k = line.slice(0, idx).trim();
    let v = line.slice(idx + 1).trim();
    if (v === 'true' || v === 'false') o[k] = (v === 'true');
    else if (/^-?\d+(\.\d+)?$/.test(v)) o[k] = Number(v);
    else o[k] = v;
  });
  return Object.keys(o).length ? JSON.stringify(o) : '';
}

/* 模板里的占位符分类提示（不拦截，只提示）：逻辑参数名 = 规则侧绑值；上下文路径 = 接口自带默认取值 */
const CTX_KEYS = ['orderId','totalAmount','discount','shippingFee','finalAmount','customer','items','product',
                  'skuCode','price','cost','docCode','bizId','ext','fact','procInstId'];
function templateHint(tpl) {
  const raw = (tpl || '').match(/\$\{[A-Za-z0-9_.\u4e00-\u9fa5]+/g) || [];
  const names = [...new Set(raw.map(s => s.slice(2)))];
  if (!names.length) return '';
  const isCtx = n => CTX_KEYS.some(k => n === k || n.startsWith(k + '.'));
  const logical = names.filter(n => !isCtx(n));
  const ctx = names.filter(isCtx);
  return `<div class="sub" style="margin-top:6px">
    ${logical.length ? `逻辑参数名（<b>规则侧逐个绑值</b>）：${logical.map(n => `<span class="tag b">${esc(n)}</span>`).join(' ')}` : ''}
    ${ctx.length ? `${logical.length ? '｜' : ''}上下文路径（作为接口自带默认取值，<b>不拦截</b>）：${ctx.map(n => `<span class="tag w">${esc(n)}</span>`).join(' ')}` : ''}
    ${logical.length ? `<div class="tag r" style="margin-top:6px">提示：该接口按逻辑参数名收参，只能被「步骤链」类型的规则调用（经典类型的规则没有绑定入口，直接调会发 null）</div>` : ''}
  </div>`;
}

      <div class="k">请求地址</div><div><code>${esc(r.requestUrl || '-')}</code></div>
      <div class="k">参数绑定</div><div><code>${esc(r.paramJson || '(未绑定，用接口模板默认取值)')}</code></div>
      <div class="k">耗时</div><div>${r.costMs == null ? '-' : r.costMs + ' ms'}</div>

    ${extKeys.length

          ${extKeys.map(k => `<tr><td>ext[<b>${esc(k)}</b>]</td><td>${esc(String(r.ext[k]))}</td><td><code>${esc('${ext.' + k + '}')}</code></td></tr>`).join('')}</tbody></table>`
      : '<div class="tag w">没有回填任何东西：要么响应不是 JSON，要么该接口在 ② 里没配「返回值映射」</div>'}
    ${(r.messages || []).length ? `<div class="sub" style="margin-top:8px">消息：${(r.messages || []).map(m => esc(m)).join('｜')}</div>` : ''}`;

/* ============ 路由 ============ */
let LOADED = false;
function route() {
  if (!LOADED) return;   // 数据没到位不渲染（浏览器加载带 hash 的地址会先触发一次 hashchange）
  const h = location.hash.replace(/^#\/?/, '').split('/');
  const view = $('view');
  const top = h[0] || 'docs';
  ['docs','actions','types'].forEach(k => { const el = $('tab-' + k); if (el) el.className = (k === top ? 'on' : ''); });
  if (top === 'docs' && h[1]) view.innerHTML = docDetail(decodeURIComponent(h[1]));
  else if (top === 'actions' && h[1]) view.innerHTML = actionDetail(decodeURIComponent(h[1]));
  else if (top === 'types' && h[1] === 'new') { ED = {steps: []}; view.innerHTML = typeEditor(); addStep(); }
  else if (top === 'types' && h[1]) { view.innerHTML = typeDetail(decodeURIComponent(h[1])); loadStepPanel(decodeURIComponent(h[1])); }
  else if (top === 'actions') { view.innerHTML = actionsList(); fillAuthSelect(); fillCatSelect(''); }
  else if (top === 'types') view.innerHTML = typesList();
  else view.innerHTML = docsList();
  return view;
}
async function refresh() { await loadCommon(); LOADED = true; route(); }

async function loadStepPanel(code) {
  const box = $('steps-box'); if (!box) return;
  try {
    const r = await api('rule/type/steps?ruleType=' + encodeURIComponent(code));
    const steps = r.steps || [];
    if (!steps.length) { box.innerHTML = ''; return; }
    const t = TYPES.find(x => x.ruleType === code) || {};
    let html = `<div class="stepbar" style="margin-top:18px"><span class="stepno" style="background:#0f172a">≡</span><b>步骤链</b><span class="sub">按序号执行</span>
      <span style="margin-left:auto" class="sub">每步：条件 → 动作（是否调接口/调哪个接口）→ 回填 ext → 后续步骤可引用</span></div>`;
    for (const s of steps) {
      const kind = {CALL:'调接口', SET_EXT:'写单据字段', MARK:'打标', MSG:'只加消息'}[s.actionType] || s.actionType;
      const a = ACTIONS.find(x => x.actionCode === s.actionCode);
      const cond = s.condField ? `<code>${esc(s.condField)} ${esc(s.condOp||'')} ${esc(s.condValue||'')}</code>` : '<span class="sub">无条件</span>';
      html += `<div class="stepcard"><div class="stepbar"><span class="stepno">${s.stepNo}</span><b>${esc(s.stepName||'')}</b>
          <span class="tag b">${esc(kind)}</span>${s.actionCode ? `<span class="tag g">${esc(s.actionCode)}</span>` : ''}
        </div>
        <div class="kv"><div class="k">条件</div><div>${cond}</div>
          <div class="k">动作</div><div>${s.actionType === 'CALL' ? '调用接口 ' + esc(s.actionCode) : (s.actionType === 'SET_EXT' ? 'ext[' + esc(s.extField) + '] = ' + esc(s.extValue) : (s.actionType === 'MARK' ? 'ext[' + esc(s.extField) + '] = true' : '只加消息'))}</div>
          ${a ? `<div class="k">入参模板</div><div><code>${esc(a.bodyTemplate||'(空)')}</code></div>
                 <div class="k">回填 ext</div><div>${(a.returns||[]).map(x => `<span class="tag g">${esc(x.targetField)}</span>`).join(' ') || '<span class="tag w">未配返回值映射</span>'}</div>` : ''}
          <div class="k">消息</div><div>${esc(s.message||'-')}</div></div></div>`;
    }
    box.innerHTML = html;
  } catch (e) { box.innerHTML = '<div class="sub">步骤链读取失败：' + esc(e.message) + '</div>'; }
}

function loadFieldForm(docCode, objectKey, fieldKey) {
  const d = DOCS.find(x => x.docCode === docCode);
  let found = null;
  const walk = ns => (ns||[]).forEach(o => { if (o.objectKey === objectKey) (o.fields||[]).forEach(f => { if (f.fieldKey === fieldKey) found = f; }); walk(o.children); });
  walk(d && d.tree);
  if (!found) return;
  toggleNew('new-field-' + objectKey);
  const g = k => $('f-' + objectKey + '-' + k);
  g('name').value = found.fieldName; g('key').value = found.fieldKey; g('type').value = found.fieldType;
  g('ex').value = found.exampleValue || ''; g('desc').value = found.fieldDesc || ''; g('expr').value = found.expr || '';
}

  try {
    const doc = ($('p-doc')||{}).value;
    const fact = JSON.parse(($('p-fact')||{}).value || '{}');
    const r = await post('rule/evaluate?docCode=' + encodeURIComponent(doc), fact);
    msg('msg-probe', '命中 ' + (r.fired == null ? '?' : r.fired) + ' 条规则', 'ok');
    const out = $('p-out');
    if (out) {
      out.style.display = 'block';
      const ext = r.ext || {};
      out.textContent = '单据数据：' + JSON.stringify(r.data) + '\n\n回填 ext：' + JSON.stringify(ext, null, 2)
        + '\n\n消息：\n' + (r.messages||[]).map(m => '· ' + m).join('\n');
    }
  } catch (e) { msg('msg-probe', e.message, 'err'); }
}


loadCommon().then(() => { LOADED = true; route(); }).catch(e => $('view').innerHTML = '<div class="card">初始化失败：' + esc(e.message) + '</div>');
window.addEventListener('hashchange', route);
</script>
</body>
